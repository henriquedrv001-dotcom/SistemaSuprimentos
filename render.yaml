services:
  - type: web
    name: suprimentos
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:release
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
